# The plugin's offline tests, in QGIS's own Docker images: 3.44 LTR and the newest release (4.2).
# They don't contact GeoFA (the end-to-end checks against GeoFA are run by hand: tests/e2e/run_e2e.ps1).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis: ["3.44", "4.2"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests (throwaway QGIS profile, no network)
        run: python3 -m unittest discover -s geofa_plugin/test -t . -v
